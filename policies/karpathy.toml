# Policy to enforce Karpathy principles
[[rule]]
name = "prevent-overengineering"
description = "Agent must not use complex patterns without prior discussion."
# Use tool-based triggers for more reliable validation
tools = ["replace", "write_file", "run_shell_command"]
action = "REJECT"
message = "STOP! Your current plan seems to violate the 'Simplicity First' principle. Please discuss trade-offs and list your assumptions before making any changes."
# We use a simple prompt-based condition that the CLI can parse
condition = "user_query_contains('complex') || user_query_contains('strategy') || user_query_contains('pattern')"
